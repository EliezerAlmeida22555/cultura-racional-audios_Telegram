<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--tg-theme-bg-color, #1a1a2e);
    color: var(--tg-theme-text-color, #ffffff);
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 1.2em;
    text-align: center;
    margin-bottom: 6px;
    color: var(--tg-theme-text-color, #fff);
  }
  .subtitle {
    font-size: 0.85em;
    text-align: center;
    color: var(--tg-theme-hint-color, #aaa);
    margin-bottom: 20px;
  }
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: none;
    background: var(--tg-theme-secondary-bg-color, #16213e);
    color: var(--tg-theme-text-color, #fff);
    font-size: 1em;
    outline: none;
  }
  input::placeholder { color: var(--tg-theme-hint-color, #888); }
  button.search-btn {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    background: var(--tg-theme-button-color, #4a90d9);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 1em;
    cursor: pointer;
    font-weight: bold;
  }
  .colecoes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .col-btn {
    padding: 14px 10px;
    border-radius: 14px;
    border: none;
    font-size: 0.9em;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    color: #fff;
    line-height: 1.4;
  }
  .col-span2 { grid-column: span 2; }

  /* Cores fixas para coleções conhecidas, fallback para novas */
  .col-AMARELÕES  { background: #b8860b; }
  .col-OBRA       { background: #2e7d32; }
  .col-RÉPLICA    { background: #b71c1c; }
  .col-TRÉPLICA   { background: #1565c0; }
  .col-HISTÓRICO  { background: #6a1b9a; }
  .col-MUSICAS    { background: #00695c; }
  .col-default    { background: #37474f; }

  .results { margin-top: 4px; }
  .vol-item {
    padding: 14px;
    border-radius: 12px;
    background: var(--tg-theme-secondary-bg-color, #16213e);
    margin-bottom: 10px;
    cursor: pointer;
    text-decoration: none;
    display: block;
    color: var(--tg-theme-text-color, #fff);
    border-left: 4px solid var(--tg-theme-button-color, #4a90d9);
  }
  .vol-title { font-weight: bold; font-size: 1em; }
  .vol-sub   { font-size: 0.8em; color: var(--tg-theme-hint-color, #aaa); margin-top: 4px; }
  .empty { text-align: center; color: var(--tg-theme-hint-color, #aaa); padding: 30px 0; }
  .header-icon { font-size: 2em; text-align: center; margin-bottom: 6px; }
  .voltar-btn {
    display: inline-block;
    margin-bottom: 12px;
    padding: 8px 14px;
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #16213e);
    color: var(--tg-theme-text-color, #fff);
    font-size: 0.9em;
    cursor: pointer;
    border: none;
  }
</style>

// Emojis por coleção
const EMOJIS = {
  'AMARELÕES': '🟡', 'OBRA': '🟢', 'RÉPLICA': '🔴',
  'TRÉPLICA': '🔵', 'HISTÓRICO': '🟣', 'MUSICAS': '🎵'
};
const EMOJI_PADRAO = '📁';

// CSS class por coleção (sanitiza para usar como classe CSS)
function cssClass(nome) {
  const known = ['AMARELÕES','OBRA','RÉPLICA','TRÉPLICA','HISTÓRICO','MUSICAS'];
  return known.includes(nome.toUpperCase()) ? `col-${nome}` : 'col-default';
}

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) tg.ready();

function norm(s) {
  return s.toLowerCase().normalize('NFC').trim();
}

function extrairNum(s) {
  const m = s.match(/\d+/);
  return m ? parseInt(m[0]) : -1;
}

// Detecta coleções automaticamente dos tópicos
function detectarColecoes() {
  const cols = new Set();
  Object.keys(TOPICOS).forEach(nome => {
    const col = nome.includes(' - ') ? nome.split(' - ')[0].trim() : nome.trim();
    cols.add(col);
  });
  return [...cols].sort();
}

// Monta botões de coleções dinamicamente
function montarBotoesColecoes() {
  const cols = detectarColecoes();
  const grid = document.getElementById('colecoes-grid');
  grid.innerHTML = '';

  cols.forEach((col, idx) => {
    const btn = document.createElement('button');
    btn.className = 'col-btn ' + cssClass(col);
    // Coleção ímpar no final sozinha ocupa 2 colunas
    if (cols.length % 2 !== 0 && idx === cols.length - 1) btn.classList.add('col-span2');
    const emoji = EMOJIS[col.toUpperCase()] || EMOJI_PADRAO;
    const qtd = Object.keys(TOPICOS).filter(k => k.startsWith(col + ' - ') || k === col).length;
    btn.innerHTML = `${emoji} ${col}<br><small style="font-weight:normal;opacity:.85">${qtd} volumes</small>`;
    btn.onclick = () => abrirColecao(col);
    grid.appendChild(btn);
  });
}

function buscarVolumes(termo) {
  const t = norm(termo).replace(/\s/g, '');
  const mCod = t.match(/^([a-z]+)(\d+)$/);
  let colEstrita = null, numEstrito = null;

  if (mCod) {
    const PREFIXOS = { a: 'AMARELÕES', o: 'OBRA', r: 'RÉPLICA', t: 'TRÉPLICA', h: 'HISTÓRICO', m: 'MUSICAS' };
    const col = PREFIXOS[mCod[1]];
    if (col) { colEstrita = col; numEstrito = parseInt(mCod[2]); }
  }

  return Object.entries(TOPICOS).filter(([nome, id]) => {
    const nNorm = norm(nome);
    if (colEstrita && numEstrito !== null) {
      return nNorm.includes(norm(colEstrita)) && extrairNum(nome) === numEstrito;
    }
    if (colEstrita) return nNorm.includes(norm(colEstrita));
    return nNorm.includes(norm(termo)) || extrairNum(nome) === extrairNum(termo);
  });
}

function mostrarResultados(volumes, tituloColecao) {
  const div = document.getElementById('results');
  if (!volumes.length) {
    div.innerHTML = '<p class="empty">Nenhum volume encontrado.<br>Tente: A01, O15, H050…</p>';
    return;
  }
  const voltar = tituloColecao ? `<button class="voltar-btn" onclick="voltar()">← Voltar</button><br>` : '';
  div.innerHTML = voltar + volumes.slice(0, 50).map(([nome, id]) => {
    const link = GROUP_LINK + id;
    return `<a class="vol-item" href="${link}" target="_blank">
      <div class="vol-title">📖 ${nome}</div>
      <div class="vol-sub">Toque para abrir os áudios no Telegram</div>
    </a>`;
  }).join('');
}

function buscar() {
  const termo = document.getElementById('search').value.trim();
  if (!termo) return;
  mostrarResultados(buscarVolumes(termo), null);
}

function abrirColecao(col) {
  const volumes = Object.entries(TOPICOS).filter(([n]) => n.startsWith(col + ' - ') || n === col);
  mostrarResultados(volumes, col);
  document.getElementById('search').value = col;
}

function voltar() {
  document.getElementById('results').innerHTML = '';
  document.getElementById('search').value = '';
}

document.getElementById('search').addEventListener('keyup', e => {
  if (e.key === 'Enter') buscar();
});

// Inicializa botões de coleções ao carregar
montarBotoesColecoes();
